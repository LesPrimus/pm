[project]
name = "pm-backend"
version = "0.1.0"
description = "FastAPI backend for the Project Management MVP"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[tool.ruff.lint]
# Defaults (pycodestyle errors, pyflakes) plus import sorting, pyupgrade, and bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
